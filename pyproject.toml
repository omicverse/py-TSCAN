[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytscan"
version = "0.1.0"
description = "Pure-Python port of TSCAN (Ji & Ji 2016) — pseudo-time reconstruction in single-cell RNA-seq via PCA + Mclust + MST."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-2.0-or-later" }
authors = [
    { name = "Zehua Zeng", email = "starlitnightly@163.com" },
]
keywords = [
    "single-cell", "scRNA-seq", "trajectory", "pseudotime",
    "tscan", "mclust", "anndata",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
]

dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
    "pandas>=1.5",
    "anndata>=0.9",
    "scikit-learn>=1.2",
    "networkx>=3.0",
    "tqdm",
    "pymclustR>=0.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]
scanpy = ["scanpy>=1.9"]
plot  = ["matplotlib>=3.6", "seaborn>=0.12"]
de    = ["pygam>=0.9"]  # for difftest's GAM

[project.urls]
Homepage = "https://github.com/omicverse/py-TSCAN"
Repository = "https://github.com/omicverse/py-TSCAN"
Issues = "https://github.com/omicverse/py-TSCAN/issues"
"Upstream R package" = "https://github.com/zji90/TSCAN"
"Upstream (omicverse)" = "https://github.com/Starlitnightly/omicverse"

[tool.setuptools.packages.find]
include = ["pytscan*"]
exclude = ["tests*", "examples*", "TSCAN-ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::RuntimeWarning",
]
